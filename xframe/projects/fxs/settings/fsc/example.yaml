name: fsc_example
fourier_transform:
  mode: midpoint
  max_order: 30
IO:
  folders:
    home: /home/user/
    data:
      home: data/
    results:
      home: results/
  files:
    # Choose one of the following for the first data.
    1_average:
      name: average_result1.h5
      folder: data
    # 1_binary:
    #   name: data1.bin
    #   folder: data
    #   options:
    #     dtype: float32

    # Choose one of the following for the second data.
    2_average:
      name: average_result2.h5
      folder: data
    # 2_binary:
    #   name: data2.bin
    #   folder: data
    #   options:
    #     dtype: float32

    # Average or reconstruction result where the grid information is stored.
    # [default: 1_average]
    # grid_info:
    #   name: average_result1.h5
    #   folder: data

    # Settings used for average command
    average_settings:
      name: average_settings.yaml
      folder: data
    # Settings used for reconstruction command
    reconstruction_settings:
      name: reconstruction_settings.yaml
      folder: data

    # Output files
    fsc:
      name: "{name}.h5"
      folder: results
    fsc_plot:
      name: "{name}.matplotlib"
      folder: results
      options:
        _format: png
        dpi: 300
        bbox_inches: tight
    aligned_averages_vtk:
      name: "{name}.h5"
      folder: results
